{% extends "base.html" %}{% block title %}Login · AI Survey Instrument{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4 p-md-5">
      <div class="eyebrow mb-2">WELCOME BACK</div><h1 class="h3 fw-bold mb-2">Log in to your account</h1>
      <p class="text-secondary mb-4">Manage surveys, interviews, and responses in one place.</p>
      <form method="post">
        <label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" required>
        <label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required>
        <button class="btn btn-primary w-100">Log in</button>
      </form>
      <p class="text-secondary mt-4 mb-0">No account? <a href="{{ url_for('register') }}">Create one</a></p>
    </div>
  </div>
</div>
{% endblock %}
